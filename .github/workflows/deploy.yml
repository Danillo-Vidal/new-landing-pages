name: Deploy (GitHub Pages)

# Builds EVERY page of the repository and publishes them together:
#   <pasta>/  →  https://<usuario>.github.io/<repo>/<pasta>/
# On pull requests it only builds and checks (nothing is published).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '*/package-lock.json'

      - id: pages
        uses: actions/configure-pages@v5

      # Installs, checks and builds each page into _site/<pasta>/.
      - run: node scripts/build-all.mjs
        env:
          # "/<repo>/" on GitHub Pages; "/" on a custom domain.
          REPO_BASE: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
